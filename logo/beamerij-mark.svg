<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" width="128" height="96" fill="none" role="img" aria-label="Beamerij">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9772f"/>
      <stop offset="0.55" stop-color="#e3a24b"/>
      <stop offset="1" stop-color="#f3cd8a"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#fbe9c4"/>
      <stop offset="0.45" stop-color="#f3cd8a"/>
      <stop offset="1" stop-color="#e3a24b"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-45%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- soft halo -->
  <g filter="url(#glow)" opacity="0.5">
    <polygon points="42,48 122,20 122,32" fill="#e3a24b"/>
    <polygon points="42,48 122,42 122,54" fill="#e3a24b"/>
    <polygon points="42,48 122,64 122,76" fill="#e3a24b"/>
    <circle cx="28" cy="48" r="15" fill="#e3a24b"/>
  </g>

  <!-- three projected beams -->
  <polygon points="42,48 122,20 122,32" fill="url(#beam)" opacity="0.92"/>
  <polygon points="42,48 122,42 122,54" fill="url(#beam)"/>
  <polygon points="42,48 122,64 122,76" fill="url(#beam)" opacity="0.88"/>

  <!-- projector lens -->
  <circle cx="28" cy="48" r="15" fill="url(#lens)"/>
  <circle cx="28" cy="48" r="14.3" fill="none" stroke="#a9772f" stroke-width="1.3" opacity="0.5"/>
  <circle cx="22.5" cy="42.5" r="3.4" fill="#ffffff" opacity="0.38"/>
</svg>
